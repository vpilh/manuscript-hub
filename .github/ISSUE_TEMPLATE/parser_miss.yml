name: Journal email not recognized
description: A journal's message was missed or misread by the parser.
labels: [parser]
body:
  - type: markdown
    attributes:
      value: |
        Help us improve the journal rules **without sharing private mail**. Rewrite the relevant sentences with made-up names, titles and IDs, keeping the original wording of the editorial phrases. Never attach the original `.eml` file.
  - type: input
    id: journal
    attributes:
      label: Journal or publisher system
      placeholder: e.g. a journal using ScholarOne or Editorial Manager
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [English, German, Other]
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Anonymized excerpt
      description: The subject line and the key sentences, with personal details replaced.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Status, deadline or manuscript ID the app should have found.
    validations:
      required: true
