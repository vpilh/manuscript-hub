[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/vpilh/manuscript-hub"

[workspace.dependencies]
mh-core = { path = "crates/mh-core" }
mh-parser = { path = "crates/mh-parser" }
mh-connectors = { path = "crates/mh-connectors" }
mh-store = { path = "crates/mh-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
