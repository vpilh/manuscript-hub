[package]
name = "mh-store"
description = "Encrypted local storage for Manuscript Hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# WP 1.3 adds rusqlite (bundled-sqlcipher-vendored-openssl) and keyring.
[dependencies]
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
mh-core.workspace = true
rusqlite = { version = "0.41", features = ["bundled", "serialize"] }
serde.workspace = true
serde_json.workspace = true
zeroize = "1"

[dev-dependencies]
tempfile = "3"
